spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: client-service
          uri: http://localhost:8081
          predicates:
            - Path=/clientEntities/** , /client-service/v3/api-docs
          filters:
            - StripPrefix=1
springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
    swagger-ui:
      enabled: true
      path: /swagger-ui.html
      config-url: /v3/api-docs/swagger-config
      urls:
        - url: /v3/api-docs
          name: API Gateway Service
          primaryName: API Gateway Service
        - url: /client-service/v3/api-docs
          name: Client Service
          primaryName: Client Service
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
