spring.application.name=Tour

spring.datasource.url=jdbc:postgresql://localhost:5432/tours
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.data.mongodb.uri=mongodb://root:secret@localhost:27017/images?authSource=admin

logging.level.org.springframework.web=info
logging.level.org.hibernate=error

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

com.ui.configuration = ui_test.json
spring.docker.compose.enabled=false
